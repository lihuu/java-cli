name: JVM CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean package
      - name: Smoke JVM JAR
        shell: bash
        run: |
          artifact=$(mvn -q -N help:evaluate -Dexpression=project.artifactId -DforceStdout)
          java -jar "target/$artifact.jar" --version
